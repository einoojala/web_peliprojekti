<!DOCTYPE html>
<html lang ="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelinäkymä</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/main.js" defer></script>
</head>

<body>
    <main id="game"
            data-state-url="/api/game"
            data-draw-url="/api/game/draw">
        <div class="players">
            <section class="players">
                <h2 id="player-1-name">Pelaaja 1</h2>
                <p id="player-1-coins">0 kolikkoa</p>
            </section>
        <section class="player">
            
                <h2 id="player-2-name">Pelaaja 2</h2>
                <p id="player-2-coins">0 kolikkoa</p>
            </section>
        </div>
        <h1>Pelinäkymä</h1>

        <div aria-live="polite"></div>
            <p id="turn-message"></p>
            <p id="card-message"></p>
            <p id="winner-message" class="winner-message" hidden></p>
        </div>

        <p id="error-message" role="alert" hidden></p>

        <section id="card-grid" aria-label="Pelikortit"></section>

        <nav class="game-navigation" aria-label="Pelin valikko">
            <a class="button" href="/instructions">Ohjeet</a>
            <a class="button" href="/">Valikko</a>
        </nav>
    </main>
</body>


</html>
