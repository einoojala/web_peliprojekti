<!DOCTYPE html>
<html lang ="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelinäkymä</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/main.js" defer></script>
</head>

<body class="pelisivu"> 

    <h1>Aarrejahti</h1> 

    <main class="game-container"> 
        <section class="players"> 
            <div class="player-box" id="player-one"> 
                <h2 id="player1-name"></h2> 
                <p class="player-points"> 
                    Pisteet: <span id="player1-coins">0</span> 
                </p> 
            </div> 
            <div class="player-box" id="player-two"> 
                <h2 id="player2-name"></h2> 
                <p class="player-points"> 
                    Pisteet: <span id="player2-coins">0</span> 
                </p> 
            </div> 
        </section> 
        <section class="turn-section"> 
            <h2 id="turn-message">Peli alkaa!</h2> 
            <p id="card-message"> 
                Valitse yksi korteista klikkaamall. 
            </p> 
        </section> 
       
        <section class="card-grid" id="card-grid"> </section> 

        <section id="winner-section" class="winner-section hidden"> 
            <h2 id="winner-message"></h2> 
            <div class="game-navigation"> 
                <button id="restart-button" class="main-button"> 
                    Aloita uudestaan 
                </button> 
                <a href="/" class="secondary-button"> 
                    Palaa päävalikkoon 
                </a> 
            </div> 
        </section> 

        <nav class="game-navigation"> 
            <a href="/aarrejahti/ohjeet" class="secondary-button"> 
                Ohjeet 
            </a> 
            <a href="/aarrejahti/etusivu" class="secondary-button"> 
                Menuvalikko 
            </a> 
        </nav> 
    </main> 
</body> 

</html>
