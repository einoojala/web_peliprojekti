<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarrejahti</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/main.js" defer></script>
</head>
<body class="etusivu">
    <main class="aloitus-container">
    <h1>Aarrejahti</h1>
    <p>Kerää kolikoita ja voita!</p>

    <div id="pelaajien-nimet">
        <h2>Syötä pelaajien nimet</h2>
        
        <form id="start-form">
            <label for="pelaaja1">Pelaaja 1:</label>
            <input type="text" id="pelaaja1" placeholder="Kirjoita nimi">

            
            <label for="pelaaja2">Pelaaja 2:</label>
            <input type="text" id="pelaaja2" placeholder="Kirjoita nimi">
                
            <p id="error-message"></p>
            <button type="submit" class="main-button">
                Aloita peli
            </button>
        </form>
    </div>

    <a href="instructions.html" class="instruction-button">
        Ohjeet
    </a>

    </main>
</body>
</html>
